<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <style>
        .valid{
            color: green;
        }
        .invalid{
            color: red;
        }
        #password-rules{
            display: none;
        }
    </style>
</head>
<body>
    <h1>Sign Up</h1>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter your name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your email" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter a password" required>

        <div id="password-rules">
            <p id="rule-length" class="invalid">At least 6 characters</p>
            <p id="rule-special" class="invalid">Must include a special character (!@#$...)</p>
            <p id="rule-upper" class="invalid">Must include an uppercase letter (A-Z)</p>
        </div>
        <br>

        <button type="submit">Submit</button>
    </form>

    <script>
        const form = document.querySelector('form');
        const passwordInput = document.getElementById('password');
        const rulesSection = document.getElementById('password-rules');
        const ruleLength = document.getElementById('rule-length');
        const ruleSpecial = document.getElementById('rule-special');
        const ruleUpper = document.getElementById('rule-upper');

        form.addEventListener('submit', (event)=>{
            event.preventDefault();
            window.location.href = "success.html";
        });

        passwordInput.addEventListener('input', ()=>{
            const password = passwordInput.value;

            rulesSection.style.display = 'block';

            const hasLength = password.length >= 6;
            const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(password);
            const hasUpper = /[A-Z]/.test(password);

            ruleLength.classList.toggle('valid', hasLength);
            ruleLength.classList.toggle('invalid', !hasLength);

            ruleSpecial.classList.toggle('valid', hasSpecial);
            ruleSpecial.classList.toggle('invalid', !hasSpecial);

            ruleUpper.classList.toggle('valid', hasUpper);
            ruleUpper.classList.toggle('invalid', !hasUpper);
        });
    </script>
</body>
</html>
